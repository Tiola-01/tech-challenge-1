
name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: tech-challenge-1
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: tech-challenge-1

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Diagnose GitHub OIDC context
      - name: Inspect OIDC claims
        uses: github/actions-oidc-debugger@v1
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Ref: $REF"
          echo "Event: $EVENT_NAME"

      # 2. Configure AWS authentication through GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Get the AWS account ID for the ECR image URI
      - name: Get AWS account ID
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      # 3. Authenticate Docker to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push a uniquely tagged Docker image
      - name: Build and push Docker image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Prepare a new ECS task definition with the image just pushed
      - name: Register updated ECS task definition
        id: task-def
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition tech-challenge-1 \
            --query taskDefinition \
            --output json > task-definition.json

          jq --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)' \
            task-definition.json > updated-task-definition.json

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      # 5. Deploy the updated task definition to ECS
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-def.outputs.task_definition_arn }}"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
